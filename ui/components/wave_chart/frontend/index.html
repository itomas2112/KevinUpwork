<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Wave Chart</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #121212;
            overflow: hidden;
        }
        #wave-root {
            position: relative;
            width: 100%;
        }
        /* Focusable (tabindex="-1") so keyboard shortcuts reach the iframe as
           soon as the user clicks the chart -- without the focus ring. */
        #wave-chart {
            width: 100%;
            outline: none;
        }

        /* Data error banner -- a strip across the top of the chart area. Shown
           only when applying a payload threw, so the pane is never silently
           blank; cleared by the next successful data application. */
        #wave-error {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 6;
            display: none;
            box-sizing: border-box;
            padding: 6px 10px;
            background: #5c1f1f;
            color: #ffffff;
            font: 12px Arial, sans-serif;
        }
        #wave-error.wa-on {
            display: block;
        }

        /* Toolbar overlay -- centred over the top of the price pane. The strip
           itself must never swallow wheel/drag events, so only its controls
           take pointer events. */
        #wave-toolbar {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
            font: 12px Arial, sans-serif;
            color: #c8c8c8;
            white-space: nowrap;
        }
        /* The status chip lives on its own row: showing it must not reflow the
           button row on a narrow chart. */
        #wave-toolbar .wa-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }
        #wave-toolbar button,
        #wave-toolbar select,
        #wave-toolbar .wa-chip {
            pointer-events: auto;
        }
        .wa-slot {
            position: relative;
        }
        #wave-toolbar button {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            color: #c8c8c8;
            font: 12px Arial, sans-serif;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 2px;
        }
        #wave-toolbar button:hover {
            background: #2a2a2a;
        }
        #wave-toolbar button.wa-armed {
            border-color: #FFD700;
            color: #FFD700;
        }
        #wave-toolbar select {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            color: #c8c8c8;
            font: 12px Arial, sans-serif;
            padding: 3px 4px;
            cursor: pointer;
            border-radius: 2px;
        }
        .wa-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 2px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
        }
        .wa-menu.wa-open {
            display: flex;
        }
        .wa-menu button {
            border: 0;
            border-radius: 0;
            text-align: left;
            width: 100%;
        }
        .wa-chip {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 3px 8px;
            display: none;
        }
        .wa-chip.wa-on {
            display: inline-block;
        }
        .wa-chip.wa-flash {
            border-color: #ef5350;
            color: #ef5350;
        }
        /* The chip's Delete button: sits inline with the selection readout. */
        #wave-toolbar .wa-chip button.wa-del {
            margin-left: 8px;
            padding: 0 5px;
            line-height: 16px;
            vertical-align: baseline;
        }
        #wave-toolbar .wa-chip button.wa-del:hover {
            border-color: #ef5350;
            color: #ef5350;
        }

        /* Fullscreen toggle -- last control in the row, set slightly apart. */
        #wave-toolbar button.wa-fs-btn {
            margin-left: 8px;
        }
        #wave-toolbar button.wa-fs-btn.wa-on {
            border-color: #FFD700;
            color: #FFD700;
        }

        /* Leg-value popup -- opened by right-clicking a leg of the selected
           pattern. Positioned in JS at the cursor and clamped inside the
           component, so it is never half off-screen; styled like the toolbar
           because it is the same kind of overlay control. */
        .wa-popup {
            position: absolute;
            z-index: 7;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 6px 8px;
            font: 12px Arial, sans-serif;
            color: #c8c8c8;
            white-space: nowrap;
        }
        .wa-popup-head {
            margin-bottom: 5px;
        }
        /* Six boxes, two to a row: CMB on the left and RSI on the right, origin
           / current / terminating down the rows. Every box carries its own
           visible label because the client's field names are what the values
           are stored under, and all six are blank until he types in them. */
        .wa-popup-row {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        .wa-popup-cell {
            width: 104px;
        }
        .wa-popup-cell label {
            display: block;
            margin-bottom: 2px;
            color: #9e9e9e;
            font-size: 11px;
        }
        .wa-popup-cell input {
            background: #121212;
            border: 1px solid #2a2a2a;
            color: #c8c8c8;
            font: 12px Arial, sans-serif;
            padding: 2px 4px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 2px;
        }
        .wa-popup-actions {
            margin-top: 6px;
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }
        .wa-popup-actions button {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            color: #c8c8c8;
            font: 12px Arial, sans-serif;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 2px;
        }
        .wa-popup-actions button:hover {
            background: #2a2a2a;
        }

        /* Fullscreen layout. Native fullscreen puts #wave-root itself on the
           screen; the fallback pins the whole iframe to the parent viewport and
           marks <body>. In both cases the root has to fill the viewport it was
           given -- the chart canvas is sized in JS, this is for the backdrop. */
        #wave-root:fullscreen {
            width: 100vw;
            height: 100vh;
            background: #121212;
        }
        body.wa-fs,
        body.wa-fs #wave-root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="wave-root">
        <div id="wave-chart" tabindex="-1"></div>
        <div id="wave-error"></div>
        <div id="wave-toolbar"></div>
    </div>
    <!-- ?v= busts browser caches -- bump it whenever either file changes. -->
    <script src="lightweight-charts.standalone.production.js?v=1"></script>
    <script src="main.js?v=15"></script>
</body>
</html>
